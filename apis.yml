aid: arbor
name: Arbor
description: Arbor is a consumer energy savings service operating in deregulated electricity
  markets across 13 states in the U.S. Northeast, Midwest, and Texas. The Arbor app analyzes
  a household's current electricity supply rate, matches the customer with vetted alternative
  suppliers, and automatically switches them to a lower-cost plan when one becomes available,
  all without changing the utility provider, interrupting service, or charging the customer.
  Arbor earns revenue through referral fees from energy suppliers rather than from consumers.
  Founded in 2022 by Andrew Meyer (previously co-founder of Swell Energy), Arbor is backed
  by First Round Capital, Obvious Ventures, Spring Tide Capital, and Blisce. Arbor is a
  consumer-facing application and does not currently publish a public API, developer portal,
  or technical documentation.
